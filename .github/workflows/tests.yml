name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Unit and hygiene · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install lightweight test dependency
        run: python -m pip install "Pillow>=10,<13"

      - name: Verify source syntax
        run: python -m compileall -q src app.py review_app.py scripts tests

      - name: Guard against committed media or secrets
        run: python scripts/check_repository_hygiene.py

      - name: Core unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

  review-ui:
    name: Human review workbench · Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install UI dependency only
        run: python -m pip install "streamlit>=1.38,<2"
      - name: Exercise review and resume without ML downloads
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p test_review_workbench.py -v

  integration:
    name: Native video and FAISS integration · Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install CPU dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Verify pipeline and app with synthetic fixtures
        env:
          PYTHONPATH: src
          RUN_INTEGRATION: "1"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: python -m unittest discover -s tests -p test_integration.py -v
