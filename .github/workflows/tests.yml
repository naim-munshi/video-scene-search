name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Unit and hygiene · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install lightweight test dependency
        run: python -m pip install "Pillow>=10,<13"

      - name: Verify source syntax
        run: python -m compileall -q src app.py scripts tests

      - name: Guard against committed media or secrets
        run: python scripts/check_repository_hygiene.py

      - name: Core unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
